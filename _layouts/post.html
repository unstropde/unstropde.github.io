---
layout: default
---
<!-- page-title -->
<section class="section bg-secondary">
	<div class="container">
		<div class="row">
			<div class="col-lg-12">
				<h4>{{ page.title | escape }}</h4>
			</div>
		</div>
	</div>
</section>
<!-- /page-title -->

<!-- blog single -->
<section>
	<div class="container">
		<div class="row">
			<div class="col-lg-12">
				<ul class="list-inline d-flex justify-content-between py-3">
					<li class="list-inline-item"><i class="ti-user mr-2"></i>Post by {{site.author.name}}</li>
					<li class="list-inline-item"><i class="ti-calendar mr-2"></i>{{page.date | date: '%b %d, %Y'}}</li>
				</ul>
				<div class="row">
					{% if page.image %}
					<div class="col-md-5 mb-4">
						<img src="{{page.image | relative_url}}" alt="{{page.title}}" class="w-100 img-fluid">
					</div>
					{% endif %}
					<div class="{% if page.image %}col-md-7{% else %}col-md-12{% endif %} mb-4">
						<div class="content">
							{{ content }}
						</div>
					</div>
				</div>
				{% if site.disqus-identifier %}
				{% include disqus-comments.html %}
				{% endif %}
			</div>
		</div>
	</div>
</section>
<!-- /blog single -->
