<p class="mb-5">Für allgemeine Fragen benutze bitte das untenstehende Formular.<br><br></p>

<form action="https://formspree.io/{{ site.contact-form }}" method="POST" class="row">
  <div class="col-lg-6">
    <input type="text" class="form-control mb-4" name="name" id="name" placeholder="NAME">
  </div>
  <div class="col-lg-6">
    <input type="email" class="form-control mb-4" name="_replyto" id="email" placeholder="E-MAIL">
  </div>
  <div class="col-12">
    <textarea name="message" id="message" class="form-control mb-4" placeholder="NACHRICHT..."></textarea>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="senden">SENDEN</button>
  </div>
</form>
